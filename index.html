function quiz(id,title,instructions,matching=false) {
  const questions = quizzes[id];

    const promptHTML = '<div class="q-top"><span class="number" aria-hidden="true">'+(i+1)+'</span><p id="'+label+'">'+safe(prompt)+'</p></div>';
    const choicesHTML = matching
      ? '<select data-i="'+i+'" aria-labelledby="'+label+'"><option value="">Choose an ending</option>'+choices.map(choice=>'<option value="'+safe(choice)+'"'+(choice===state.answers[i]?' selected':'')+'>'+safe(choice)+'</option>').join('')+'</select>'
      : '<div class="choices" role="group" aria-labelledby="'+label+'">'+choices.map(choice=>'<button type="button" class="choice" data-i="'+i+'" data-choice="'+safe(choice)+'" aria-pressed="'+(state.answers[i]===choice)+'">'+safe(choice)+'</button>').join('')+'</div>';
    return '<div class="q">'+promptHTML+choicesHTML+'<p class="feedback" hidden></p></div>';
  }).join('')+'</div>'+controls()+'</section>';
}
function updateQuiz(section) {
  if(section.dataset.quiz==='clothes') return updateClothes(section);
  const id = section.dataset.quiz;
  const state = states[id];
  let right = 0, done = 0;
  section.querySelectorAll('.q').forEach((row,i)=>{
    const {answer,note} = quizzes[id][i];
    const isRight = state.answers[i]===answer;
    const answered = state.answers[i]!=='';
    const display = state.checked && answered;
    right += Number(isRight);
    done += Number(answered);
    row.classList.toggle('good',display && isRight);
    row.classList.toggle('bad',display && !isRight);
    const feedback = row.querySelector('.feedback');
    feedback.hidden = !state.key && !display;
    feedback.textContent = state.key?'Answer: '+answer+(note?' · '+note:''):isRight?'Correct.':'Try again.';
  });
  const total = quizzes[id].length;
  section.querySelector('.score').textContent = state.checked?right+' of '+total+' correct.'+(done<total?' '+(total-done)+' unanswered.':''):'';
  section.querySelector('[data-action="key"]').textContent = state.key?'Hide answer key':'Show answer key';
}

}
function updateClothes(section) {
  const selected = [...clothes.selected];
  const hits = selected.filter(word=>tried.includes(word));
  const missed = tried.filter(word=>!clothes.selected.has(word));
  const extra = selected.length-hits.length;
  section.querySelectorAll('[data-clothing]').forEach(control=>{
    const word = control.dataset.clothing;
    const chosen = clothes.selected.has(word);
    control.setAttribute('aria-pressed',chosen);
    control.classList.toggle('match-right',clothes.checked && chosen && tried.includes(word));
    control.classList.toggle('match-wrong',clothes.checked && chosen && !tried.includes(word));
  });
  const score = section.querySelector('.score');
  score.textContent = clothes.checked
    ? selected.length===0?'Choose the clothes you saw first.':missed.length===0 && extra===0?'All 5 items correct!':hits.length+' of 5 correct items selected.'+(extra?' '+extra+' extra '+(extra===1?'item.':'items.'):'')
    : '';
  const result = section.querySelector('.word-result');
  result.hidden = !clothes.key;
  result.textContent = 'Answer: '+tried.join(', ')+'.';
  section.querySelector('[data-action="key"]').textContent = clothes.key?'Hide answer key':'Show answer key';
}

    ['Do you enjoy shopping for these things?',items,'I enjoy shopping for … because …'],
    ['Do you like shopping in these places?',places,'I like shopping at … because … / I like shopping online because …']
  ].map(([prompt,choices,frame],i)=>'<div class="q" data-warm-group="'+i+'"><div class="q-top"><span class="number">'+(i===0?'A':'B')+'</span><p id="warm-'+i+'">'+prompt+'</p></div><div class="choices" role="group" aria-labelledby="warm-'+i+'">'+choices.map(word=>'<button type="button" class="choice" data-warm="'+safe(word)+'" aria-pressed="'+(warmState[i]===word)+'">'+safe(word)+'</button>').join('')+'</div><p class="warm-follow" '+(warmState[i]===null?'hidden':'')+'><strong>Say it:</strong> '+frame+'</p></div>').join('')+'</div>');
}
function usefulLanguage() {
  return card('Conversation builder','<div class="phrase-grid">'+language.map(([title,...lines])=>'<div class="tile"><h3>'+title+'</h3><ul>'+lines.map(line=>'<li>'+line+'</li>').join('')+'</ul></div>').join('')+'</div><p><strong>This / that</strong> are for one item. <strong>These / those</strong> are for two or more. Use <strong>this / these</strong> for things near you.</p>')+
    card('Exercise 6 · Ask about an item','<p class="description">Tap an item for a model question. Practice with two items and ask about color, size, and price.</p><div class="choices" role="group" aria-label="Choose a clothing item">'+products.map((name,i)=>'<button type="button" class="choice" data-product="'+i+'" aria-pressed="'+(product===i)+'">'+name+'</button>').join('')+'</div><p class="model-line" id="product-line" aria-live="polite" '+(product===null?'hidden':'')+'>'+(productQuestions[product]??'')+'</p>')+
    quiz('help','Exercise 7 · Offer help','Choose a suitable line in this practice version of the conversation.');
}
function scenarioBody() {
  const chosen = scenarios[scenario];
  return '<h3>'+chosen.title+'</h3><div class="roles">'+chosen.roles.map(([student,role,instructions])=>'<article class="tile"><span class="role-label">'+student+'</span><h3>'+role+'</h3><p>'+instructions+'</p></article>').join('')+'</div><details><summary>Show a model dialogue</summary><div class="dialogue">'+chosen.model.map(([speaker,line])=>'<p><strong>'+speaker+':</strong> '+line+'</p>').join('')+'</div></details>';
}
function speaking() {
  return card('Exercise 8 · Choose a situation','<p class="description">Read your role. Take a moment to prepare, then speak to your partner.</p><div class="choices" role="group" aria-label="Choose a situation">'+scenarios.map((item,i)=>'<button type="button" class="choice" data-situation="'+i+'" aria-pressed="'+(scenario===i)+'">'+item.title+'</button>').join('')+'</div><div id="scenario" class="model-line" aria-live="polite">'+scenarioBody()+'</div>')+
    card('Act it out · 90 seconds','<ol class="talk-list"><li>The salesclerk offers help.</li><li>The customer asks about size or color, checks the price, and asks to try the item on.</li><li>Finish the conversation. Change situations and swap roles.</li></ol><div class="control-line timer-controls"><output class="timer" id="timer" aria-label="Time left">1:30</output>'+btn('Start timer','start','primary')+btn('Reset timer','timer-reset')+'</div><details><summary>Show speaking checklist</summary><div class="dialogue"><p>Did the salesclerk offer help?</p><p>Did the customer ask about the item and how to try it on?</p><p>Did both partners speak and respond to each other?</p></div></details>');
}
function render() {
  clearInterval(timerId);
  stage = Math.max(0,steps.findIndex(([id])=>location.hash==='#'+id));
  const [id,label,title,subtitle] = steps[stage];
  nav.innerHTML = steps.map(([slug,name],i)=>'<a class="nav-link" href="#'+slug+'"'+(i===stage?' aria-current="page"':'')+'><span>'+String(i+1).padStart(2,'0')+'</span>'+name+'</a>').join('');
  const cover = id==='warm-up';
  const hero = '<section class="hero '+(cover?'intro-hero':id==='speaking'?'accent':'')+'"><div><p class="eyebrow">UNIT 5D · '+label.toUpperCase()+'</p><h1 tabindex="-1">'+title+'</h1><p class="sub">'+subtitle+'</p>'+(cover?'<div class="tag-line"><span class="hero-tag">2 listening clips</span><span class="hero-tag">Shopping role-play</span></div>':'')+'</div>'+(cover?'<img class="hero-photo" src="'+images.hero+'" alt="Shoppers choosing and trying on clothes">':'')+'</section>';
  const content = [
    ()=>warmup(),
    ()=>video(0)+quiz('tf','Exercise 2 · True or false?','Watch Part 1 and choose True or False.')+quiz('detail','Exercise 3 · Listen for details','Watch Part 1 again and choose the words that complete the sentences.'),
    ()=>video(1)+checklist()+quiz('match','Exercise 5 · Match the sentence halves','Watch Part 2 again. Choose an ending for each question.',true),
    ()=>usefulLanguage(),
    ()=>speaking()
  ][stage]();
  const back = steps[stage-1], next = steps[stage+1];
  page.innerHTML = hero+content+'<div class="sequence">'+(back?'<a class="button" href="#'+back[0]+'">← '+back[1]+'</a>':'<span></span>')+(next?'<a class="button primary" href="#'+next[0]+'">'+next[1]+' →</a>':'<a class="button primary" href="#warm-up">Back to warm-up ↗</a>')+'</div>';
  page.querySelectorAll('[data-quiz]').forEach(updateQuiz);
}
function setAnswer(section,index,value) {
  const state = states[section.dataset.quiz];
  state.answers[index] = value;
  state.checked = false;
  section.querySelectorAll('button[data-i="'+index+'"]').forEach(control=>control.setAttribute('aria-pressed',control.dataset.choice===value));
  updateQuiz(section);
}
function loadVideo(index) {
  const clip = videos[index];
  const frame = document.createElement('iframe');
  frame.title = 'Unit 5D Listening '+(index+1)+' · Track '+clip.track;
  frame.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
  frame.allowFullscreen = true;
  frame.referrerPolicy = 'strict-origin-when-cross-origin';
  frame.src = 'https://www.youtube-nocookie.com/embed/'+clip.id+'?autoplay=1&rel=0&playsinline=1';
  document.querySelector('#player-'+index).replaceChildren(frame);
  frame.focus();
}
function timer(action) {
  clearInterval(timerId);
  const readout = document.querySelector('#timer');
  const start = page.querySelector('[data-action="start"]');
  const paint = seconds=>readout.textContent = Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0');
  paint(90);
  start.disabled = action==='start';
  start.textContent = action==='start'?'Timer running':'Start timer';
  if(action==='start') {
    const end = Date.now()+90000;
    timerId = setInterval(()=>{
      const left = Math.max(0,Math.ceil((end-Date.now())/1000));
      paint(left);
      if(left===0) {
        clearInterval(timerId);
        readout.textContent = 'Time’s up!';
        start.textContent = 'Start again';
        start.disabled = false;
      }
    },200);
  }
}
page.addEventListener('change',event=>{
  if(event.target.matches('select[data-i]')) setAnswer(event.target.closest('[data-quiz]'),Number(event.target.dataset.i),event.target.value);
});
page.addEventListener('click',event=>{
  const target = event.target.closest('button');
  if(!target) return;
  if(target.hasAttribute('data-warm')) {
    const group = target.closest('[data-warm-group]');
    warmState[Number(group.dataset.warmGroup)] = target.dataset.warm;
    group.querySelectorAll('button').forEach(control=>control.setAttribute('aria-pressed',control===target));
    group.querySelector('.warm-follow').hidden = false;
    return;
  }
  if(target.hasAttribute('data-product')) {
    product = Number(target.dataset.product);
    page.querySelectorAll('[data-product]').forEach(control=>control.setAttribute('aria-pressed',control===target));
    const line = document.querySelector('#product-line');
    line.textContent = productQuestions[product];
    line.hidden = false;
    return;
  }
  if(target.hasAttribute('data-situation')) {
    scenario = Number(target.dataset.situation);
    page.querySelectorAll('[data-situation]').forEach(control=>control.setAttribute('aria-pressed',control===target));
    document.querySelector('#scenario').innerHTML = scenarioBody();
    timer('timer-reset');
    return;
  }
  const action = target.dataset.action;
  const section = target.closest('[data-quiz]');
  if(section) {
    if(target.hasAttribute('data-choice')) return setAnswer(section,Number(target.dataset.i),target.dataset.choice);
    const isChecklist = section.dataset.quiz==='clothes';
    const state = isChecklist?clothes:states[section.dataset.quiz];
    if(target.hasAttribute('data-clothing')) {
      const word = target.dataset.clothing;
      if(clothes.selected.has(word)) clothes.selected.delete(word);
      else clothes.selected.add(word);
      clothes.checked = false;
    }
    if(action==='check') state.checked = true;
    if(action==='key') state.key = !state.key;
    if(action==='reset') {
      state.checked = false;
      state.key = false;
      if(isChecklist) clothes.selected.clear();
      else {
        state.answers.fill('');
        section.querySelectorAll('button[data-choice]').forEach(control=>control.setAttribute('aria-pressed','false'));
        section.querySelectorAll('select').forEach(control=>control.value='');
      }
    }
    updateQuiz(section);
  }
  if(action==='video-0'||action==='video-1') loadVideo(Number(action.at(-1)));
  if(action==='start'||action==='timer-reset') timer(action);
});
window.addEventListener('hashchange',()=>{
  if(location.hash==='#lesson') return;
  render();
  window.scrollTo(0,0);
  page.querySelector('h1').focus({preventScroll:true});
});
render();
</script>
</body>
</html>
